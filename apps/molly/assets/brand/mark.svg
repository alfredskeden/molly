  <rect id="sleep" x="36" y="42" width="74.4" height="18" rx="9" fill="#aba9e8"/>
  <rect id="feed" x="72" y="72" width="57.6" height="18" rx="9" fill="#e0a07d"/>
  <rect id="diaper" x="50.4" y="102" width="18" height="18" rx="9" fill="#77c4a3"/>
  <rect id="med" x="103.2" y="132" width="18" height="18" rx="9" fill="#e7c869"/>
  <rect id="now" x="126" y="34" width="4" height="124" rx="2" fill="#f9f4ee"/>
</svg>
